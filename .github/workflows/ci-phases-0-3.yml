name: Todo API CI/CD (Phases 0-6)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag image a deployer en production (ex: latest ou sha-xxxx)"
        required: true
        default: "latest"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  test-integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: todo_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U todo_user -d todo_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      STORAGE_MODE: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: todo_test
      DB_USER: todo_user
      DB_PASSWORD: todo_pass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  security-audit:
    name: Security audit (critical)
    runs-on: ubuntu-latest
    needs:
      - test-unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=critical

  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-integration
      - security-audit
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USER }}/todo-api:latest
            ${{ secrets.DOCKERHUB_USER }}/todo-api:sha-${{ github.sha }}

  deploy-k3s:
    name: Deploy to K3s
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && secrets.KUBE_CONFIG != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          if echo "${{ secrets.KUBE_CONFIG }}" | grep -q "apiVersion:"; then
            printf '%s' "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
          else
            echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests
        run: |
          sed "s|your-dockerhub-user|${{ secrets.DOCKERHUB_USER }}|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

      - name: Update image and wait for rollout
        run: |
          kubectl set image deployment/todo-api todo-api=${{ secrets.DOCKERHUB_USER }}/todo-api:sha-${{ github.sha }}
          kubectl rollout status deployment/todo-api --timeout=180s
          kubectl get pods -l app=todo-api -o wide

  deploy-prod:
    name: Manual production deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          if [ -n "${{ secrets.PROD_KUBE_CONFIG }}" ]; then
            KCFG="${{ secrets.PROD_KUBE_CONFIG }}"
          else
            KCFG="${{ secrets.KUBE_CONFIG }}"
          fi

          if echo "$KCFG" | grep -q "apiVersion:"; then
            printf '%s' "$KCFG" > "$HOME/.kube/config"
          else
            echo "$KCFG" | base64 --decode > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"

      - name: Deploy requested tag
        run: |
          kubectl set image deployment/todo-api todo-api=${{ secrets.DOCKERHUB_USER }}/todo-api:${{ inputs.image_tag }}
          kubectl rollout status deployment/todo-api --timeout=180s
