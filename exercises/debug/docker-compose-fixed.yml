services:
  web:
    build: ../..
    ports:
      - "3002:3000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: todo_user
      DB_PASSWORD: todo_pass
      DB_NAME: todo_db
      STORAGE_MODE: postgres
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
